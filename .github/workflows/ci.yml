# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main__, develop__]
  push:
    branches: [main__]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. 型チェック
  # ------------------------------------------------------------------
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run typecheck

  # ------------------------------------------------------------------
  # 2. Biome (format + lint)
  # ------------------------------------------------------------------
  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run lint:biome
      - run: pnpm --filter trip-app run format:check

  # ------------------------------------------------------------------
  # 3. ESLint
  # ------------------------------------------------------------------
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run lint:eslint

  # ------------------------------------------------------------------
  # 4. react-doctor (React アンチパターン検出)
  # ------------------------------------------------------------------
  react-doctor:
    name: ReactDoctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run lint:doctor

  # ------------------------------------------------------------------
  # 5. knip (デッドコード検出)
  # ------------------------------------------------------------------
  knip:
    name: DeadCode (knip)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run knip

  # ------------------------------------------------------------------
  # 6. テスト + カバレッジ
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/trip-app/coverage/

  # ------------------------------------------------------------------
  # 7. ビルド (typecheck + biome + eslint 通過後)
  # ------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, biome, eslint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trip-app run build
