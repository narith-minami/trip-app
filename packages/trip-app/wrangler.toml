name = "trip-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/server/app.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

# ============================================================================
# D1 Database Binding
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "trip-app-db"
database_id = "d61efaa7-4652-4955-b92f-52e8f056bc83"

# ============================================================================
# R2 Bucket Binding
# R2 must be enabled for this Cloudflare account (Dashboard → R2 → Enable R2)
# and the "trip-app-photos" bucket created (`wrangler r2 bucket create
# trip-app-photos`) before `wrangler deploy` will succeed with this binding
# uncommented. Cover thumbnail upload/serving returns 503 until then.
# ============================================================================
[[r2_buckets]]
binding = "R2"
bucket_name = "trip-app-photos"

# ============================================================================
# Environment Variables (public)
# ============================================================================
[vars]
BETTER_AUTH_URL = "https://trip-app.narith-for-work.workers.dev"
# Placeholder until a sending domain is verified in the Resend dashboard —
# replace with a real "Name <address@your-verified-domain>" before relying
# on password-reset emails in production.
EMAIL_FROM = "Trip App <noreply@example.com>"

# Note: Sensitive environment variables (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, AUTH_SECRET,
# YAHOO_CLIENT_ID, RESEND_API_KEY) should be set via Cloudflare Dashboard or wrangler secret commands:
# - wrangler secret put GOOGLE_CLIENT_ID
# - wrangler secret put GOOGLE_CLIENT_SECRET
# - wrangler secret put AUTH_SECRET
# - wrangler secret put YAHOO_CLIENT_ID
# - wrangler secret put RESEND_API_KEY

# ============================================================================
# Service Bindings (optional, for inter-service communication)
# ============================================================================
# [[services]]
# binding = "AUTH_SERVICE"
# service = "auth-worker"

# ============================================================================
# Preview Environment (`wrangler deploy --env preview`, for branches other
# than main)
#
# `name` must be set explicitly — wrangler does NOT auto-suffix the
# top-level name for named environments, so omitting this would deploy over
# the production worker.
#
# vars and bindings are NOT inherited from the top level in wrangler.toml,
# so they're redeclared below. D1/R2 are intentionally left unbound: the
# client bundle for this environment is built with VITE_MOCK=true (see
# `pnpm deploy:preview`), which swaps in the mock API/auth modules and
# never issues real fetches, so preview has no need to touch production
# data or storage. If a future preview build ever expects real API traffic,
# add dedicated (non-production) d1_databases/r2_buckets entries here first.
# ============================================================================
[env.preview]
name = "trip-app-preview"

[env.preview.vars]
# Placeholder — replace with this environment's actual workers.dev/custom
# domain once the preview worker has been deployed once and its URL known.
BETTER_AUTH_URL = "https://trip-app-preview.workers.dev"
EMAIL_FROM = "Trip App <noreply@example.com>"
