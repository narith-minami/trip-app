name = "trip-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/server/app.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

# ============================================================================
# D1 Database Binding
# ============================================================================
[[d1_databases]]
binding = "DB"
database_name = "trip-app-db"
database_id = "d61efaa7-4652-4955-b92f-52e8f056bc83"

# ============================================================================
# R2 Bucket Binding
# The "trip-app-photos" bucket does not exist in the Cloudflare account yet.
# Create it first (Dashboard → R2 → Create bucket, or
# `wrangler r2 bucket create trip-app-photos`), then uncomment below.
# Cover thumbnail upload/serving returns 503 until this is enabled.
# ============================================================================
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "trip-app-photos"

# ============================================================================
# Environment Variables (public)
# ============================================================================
[vars]
BETTER_AUTH_URL = "https://trip-app.narith-for-work.workers.dev"

# Note: Sensitive environment variables (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, AUTH_SECRET)
# should be set via Cloudflare Dashboard or wrangler secret commands:
# - wrangler secret put GOOGLE_CLIENT_ID
# - wrangler secret put GOOGLE_CLIENT_SECRET
# - wrangler secret put AUTH_SECRET

# ============================================================================
# Service Bindings (optional, for inter-service communication)
# ============================================================================
# [[services]]
# binding = "AUTH_SERVICE"
# service = "auth-worker"
